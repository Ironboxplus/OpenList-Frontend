name: UI compare (Cloudreve reference)

# Screenshots of Cloudreve's and our file browser on the same sample files,
# for design reference, and the full-site audit of our frontend in a real
# browser (scripts/ui-compare/audit.mjs). Throwaway containers and accounts;
# nothing is deployed.

on:
  # A push to this branch runs it without touching main (a push to main
  # publishes rolling, which every node pulls).
  push:
    branches: ["ui-compare"]
  workflow_dispatch:
    inputs:
      openlist_image:
        description: "OpenList image to shoot"
        required: false
        default: "ghcr.io/ironboxplus/openlist:front-rolling"
      cloudreve_image:
        description: "Cloudreve image to shoot"
        required: false
        default: "cloudreve/cloudreve:latest"
      build_frontend:
        description: "Build this checkout's frontend and serve it through the OpenList image (dist_dir)"
        required: false
        type: boolean
        default: true
      compare:
        description: "Shoot the Cloudreve comparison"
        required: false
        type: boolean
        default: true
      bugs:
        description: "Run the specs of the four reported shell bugs (fails when one is not fixed)"
        required: false
        type: boolean
        default: true
      audit:
        description: "Run the full-site audit (every route, dialog and preview, 3 widths x 2 themes)"
        required: false
        type: boolean
        default: true
      frontend_src:
        description: "Old-code run: build src/ of this commit, with the specs of the checked-out ref"
        required: false
        default: ""

permissions:
  contents: read

env:
  COMPARE: ${{ github.event_name != 'workflow_dispatch' || inputs.compare }}
  AUDIT: ${{ github.event_name != 'workflow_dispatch' || inputs.audit }}
  BUGS: ${{ github.event_name != 'workflow_dispatch' || inputs.bugs }}

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Frontend source from another commit
        if: inputs.frontend_src != ''
        env:
          SRC_SHA: ${{ inputs.frontend_src }}
        run: |
          git fetch --no-tags --depth=1 origin "$SRC_SHA"
          rm -rf src
          git checkout FETCH_HEAD -- src

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"

      # The image only brings the backend: the frontend under test is this
      # checkout's build, served from a custom dist dir (see the config.json
      # written below), so a branch can be shot without publishing anything.
      # The build is cached by the hash of everything it reads.
      - name: Frontend build cache
        id: dist
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: ui-dist-v1-${{ hashFiles('src/**', 'public/**', 'patches/**', 'index.html', 'vite.config.*', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - uses: pnpm/action-setup@v6
        if: steps.dist.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_frontend)
        with:
          run_install: false

      - name: pnpm store path
        id: store
        if: steps.dist.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_frontend)
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        id: c1
        if: steps.store.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: ui-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ui-pnpm-store-

      - name: Build frontend
        id: build
        if: steps.dist.outputs.cache-hit != 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_frontend)
        run: |
          pnpm install --frozen-lockfile
          pnpm build --sourcemap

      - name: Sample files (cached by the script's hash)
        id: samples
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ui-samples
          key: ui-samples-${{ hashFiles('scripts/ui-compare/make-samples.sh') }}

      # the script marks a finished tree; a restored tree without the mark is made again
      - name: Make sample files
        id: make
        run: |
          [ -f "$RUNNER_TEMP/ui-samples/.complete" ] && exit 0
          rm -rf "$RUNNER_TEMP/ui-samples"
          bash scripts/ui-compare/make-samples.sh "$RUNNER_TEMP/ui-samples"

      - name: Sample paths
        run: |
          sudo chmod -R a+rwX "$RUNNER_TEMP/ui-samples"
          echo "SAMPLES=$RUNNER_TEMP/ui-samples/samples" >> "$GITHUB_ENV"
          echo "SAMPLES_AUDIT=$RUNNER_TEMP/ui-samples/samples-audit" >> "$GITHUB_ENV"

      - name: Start containers
        run: |
          set -e
          [ "$COMPARE" = true ] && docker run -d --name cloudreve -p 5212:5212 "${{ inputs.cloudreve_image || 'cloudreve/cloudreve:latest' }}"
          # the image runs as a non-root user: give it a data dir it can write
          mkdir -p "$RUNNER_TEMP/oldata" && chmod 777 "$RUNNER_TEMP/oldata"
          DIST_MOUNT=""
          if [ -d dist ]; then
            echo '{"dist_dir":"/frontend-dist"}' > "$RUNNER_TEMP/oldata/config.json"
            chmod 666 "$RUNNER_TEMP/oldata/config.json"
            DIST_MOUNT="-v $PWD/dist:/frontend-dist:ro"
          fi
          AUDIT_MOUNT=""
          [ -n "$SAMPLES_AUDIT" ] && AUDIT_MOUNT="-v $SAMPLES_AUDIT:/samples-audit"
          docker run -d --name openlist -p 5244:5244 -e FRONTEND_SOURCE=embedded -v "$RUNNER_TEMP/oldata:/opt/openlist/data" -v "$SAMPLES:/samples" $AUDIT_MOUNT $DIST_MOUNT "${{ inputs.openlist_image || 'ghcr.io/ironboxplus/openlist:front-rolling' }}"
          PORTS=5244; [ "$COMPARE" = true ] && PORTS="5212 5244"
          for p in $PORTS; do
            for i in $(seq 1 90); do curl -fsS -o /dev/null "http://127.0.0.1:$p/" && break; sleep 2; done
          done
          docker logs openlist 2>&1 | grep -iE "dist" | head -3 || true
          # Throwaway credentials for these containers only; never printed.
          OL_PASS="$(openssl rand -hex 12)"; CR_PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$OL_PASS"; echo "::add-mask::$CR_PASS"
          echo "OL_PASS=$OL_PASS" >> "$GITHUB_ENV"; echo "CR_PASS=$CR_PASS" >> "$GITHUB_ENV"

      - name: Playwright cache
        id: pw
        uses: actions/cache/restore@v6
        with:
          path: |
            scripts/ui-compare/node_modules
            ~/.cache/ms-playwright
          key: ui-playwright-${{ runner.os }}-${{ hashFiles('scripts/ui-compare/package.json') }}

      - name: Playwright install
        id: pwinstall
        working-directory: scripts/ui-compare
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium >/dev/null
          else
            npm install --no-audit --no-fund >/dev/null
            npx playwright install --with-deps chromium >/dev/null
          fi

      - name: Shoot
        if: env.COMPARE == 'true'
        working-directory: scripts/ui-compare
        run: node shoot.mjs "$RUNNER_TEMP/shots"

      - name: Bug specs
        if: env.BUGS == 'true'
        working-directory: scripts/ui-compare
        run: node bugs.mjs "$RUNNER_TEMP/bugs"

      - name: Audit
        if: always() && env.AUDIT == 'true'
        working-directory: scripts/ui-compare
        run: node audit.mjs "$RUNNER_TEMP/audit"

      - name: Audit summary
        if: always() && env.AUDIT == 'true'
        run: head -c 60000 "$RUNNER_TEMP/audit/audit.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs on failure
        if: failure()
        run: |
          docker logs cloudreve 2>&1 | tail -50 | grep -viE "password|token" || true
          docker logs openlist 2>&1 | tail -50 | grep -viE "password|token" || true

      # Saves: never from a cancelled run, and only what the producing step
      # finished. always() saved a half-made sample tree from a cancelled run
      # under a key that can never be replaced; run 45801026801 restored that
      # 202-byte cache and every spec found no files.
      - name: Save Frontend build cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ui-dist-v1-${{ hashFiles('src/**', 'public/**', 'patches/**', 'index.html', 'vite.config.*', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - name: Save pnpm store cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.c1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: ui-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ui-pnpm-store-
      - name: Save Sample files (cached by the script's hash)
        if: ${{ !cancelled() && steps.samples.outputs.cache-hit != 'true' && steps.make.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ui-samples
          key: ui-samples-${{ hashFiles('scripts/ui-compare/make-samples.sh') }}
      - name: Save Playwright cache
        if: ${{ !cancelled() && steps.pw.outputs.cache-hit != 'true' && steps.pwinstall.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            scripts/ui-compare/node_modules
            ~/.cache/ms-playwright
          key: ui-playwright-${{ runner.os }}-${{ hashFiles('scripts/ui-compare/package.json') }}

      - uses: actions/upload-artifact@v7
        if: always() && env.COMPARE == 'true'
        with:
          name: ui-compare
          path: ${{ runner.temp }}/shots
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always() && env.BUGS == 'true'
        with:
          name: ui-bugs
          path: ${{ runner.temp }}/bugs
          retention-days: 3

      - uses: actions/upload-artifact@v7
        if: always() && env.AUDIT == 'true'
        with:
          name: ui-audit
          path: ${{ runner.temp }}/audit
          retention-days: 3
