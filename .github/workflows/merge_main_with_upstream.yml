name: Merge Main With Upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-main-with-upstream
  cancel-in-progress: false

jobs:
  merge:
    name: Merge upstream/main into main
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/OpenListTeam/OpenList-Frontend.git
          git fetch --no-tags origin main
          git fetch --no-tags upstream main

      - name: Check whether merge is needed
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "need_merge=false" >> "$GITHUB_OUTPUT"
            echo "origin/main already contains upstream/main"
          else
            echo "need_merge=true" >> "$GITHUB_OUTPUT"
            echo "upstream/main has new commits to merge"
          fi

      - name: Merge upstream/main into main
        if: steps.check.outputs.need_merge == 'true'
        run: |
          git checkout main
          git reset --hard origin/main
          git merge --no-edit upstream/main

      - name: Push merged main
        if: steps.check.outputs.need_merge == 'true'
        run: git push origin main
