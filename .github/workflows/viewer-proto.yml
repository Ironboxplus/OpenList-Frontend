name: Viewer prototype

# design/viewer-proto (docs/DESIGN_FE_VIEWER_PROTO_1127.md) against a throwaway
# OpenList with the ui-compare sample files: screenshots at three widths in
# light and dark, a recording per animation, the measured timings and the
# checks (scripts/ui-compare/viewer-proto.mjs). Also checks that the release
# build does not contain the prototype. Nothing is deployed.

on:
  push:
    branches: ["main"]
    paths:
      - "design/viewer-proto/**"
      - "scripts/ui-compare/viewer-proto.mjs"
      - "scripts/ui-compare/proto-serve.mjs"
      - "scripts/ui-compare/make-samples.sh"
      - ".github/workflows/viewer-proto.yml"
  workflow_dispatch:
    inputs:
      openlist_image:
        description: "OpenList image the prototype talks to"
        required: false
        default: "ghcr.io/ironboxplus/openlist:front-rolling"

permissions:
  contents: read

concurrency:
  group: viewer-proto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"

      # Computed once: the build steps add files under the hashed trees.
      - name: Cache keys
        id: keys
        run: |
          echo "proto=viewer-proto-dist-v1-${{ hashFiles('design/viewer-proto/src/**', 'design/viewer-proto/index.html', 'design/viewer-proto/vite.config.ts', 'design/viewer-proto/package.json', 'src/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}" >> "$GITHUB_OUTPUT"
          echo "dist=ui-dist-v1-${{ hashFiles('src/**', 'public/**', 'patches/**', 'index.html', 'vite.config.*', 'tsconfig*.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Prototype build cache
        id: proto
        uses: actions/cache/restore@v6
        with:
          path: design/viewer-proto/dist
          key: ${{ steps.keys.outputs.proto }}

      # the release build of this source, shared with ui-compare.yml
      - name: Release build cache
        id: dist
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: ${{ steps.keys.outputs.dist }}

      - uses: pnpm/action-setup@v6
        if: steps.proto.outputs.cache-hit != 'true' || steps.dist.outputs.cache-hit != 'true'
        with:
          run_install: false

      - name: pnpm store path
        id: store
        if: steps.proto.outputs.cache-hit != 'true' || steps.dist.outputs.cache-hit != 'true'
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache
        id: c1
        if: steps.store.outcome == 'success'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: ui-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ui-pnpm-store-

      - name: Install
        id: install
        if: steps.store.outcome == 'success'
        run: pnpm install --frozen-lockfile

      - name: Build the prototype
        id: build
        if: steps.proto.outputs.cache-hit != 'true'
        working-directory: design/viewer-proto
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Release build
        id: release
        if: steps.dist.outputs.cache-hit != 'true'
        run: pnpm build

      # The release build starts from index.html and src/; the prototype's
      # templates carry test ids nothing in src/ uses.
      - name: The release build does not contain the prototype
        run: |
          grep -rlq 'dock-frame' design/viewer-proto/dist || { echo "marker missing from the prototype build"; exit 1; }
          if grep -rlE 'dock-frame|viewer-proto' dist; then echo "the release build contains the prototype"; exit 1; fi
          echo "release dist: $(find dist -type f | wc -l) files, no prototype code"

      - name: Sample files (cached by the script's hash)
        id: samples
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ui-samples
          key: ui-samples-${{ hashFiles('scripts/ui-compare/make-samples.sh') }}

      - name: Make sample files
        id: make
        run: |
          [ -f "$RUNNER_TEMP/ui-samples/.complete" ] && exit 0
          rm -rf "$RUNNER_TEMP/ui-samples"
          bash scripts/ui-compare/make-samples.sh "$RUNNER_TEMP/ui-samples"

      - name: Start OpenList
        run: |
          set -e
          sudo chmod -R a+rwX "$RUNNER_TEMP/ui-samples"
          mkdir -p "$RUNNER_TEMP/oldata" && chmod 777 "$RUNNER_TEMP/oldata"
          docker run -d --name openlist -p 5244:5244 -e FRONTEND_SOURCE=embedded \
            -v "$RUNNER_TEMP/oldata:/opt/openlist/data" \
            -v "$RUNNER_TEMP/ui-samples/samples:/samples" \
            -v "$RUNNER_TEMP/ui-samples/samples-audit:/samples-audit" \
            "${{ inputs.openlist_image || 'ghcr.io/ironboxplus/openlist:front-rolling' }}"
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:5244/ && break; sleep 2; done
          # throwaway credentials for this container only; never printed
          OL_PASS="$(openssl rand -hex 12)"
          echo "::add-mask::$OL_PASS"
          echo "OL_PASS=$OL_PASS" >> "$GITHUB_ENV"

      - name: Playwright cache
        id: pw
        uses: actions/cache/restore@v6
        with:
          path: |
            scripts/ui-compare/node_modules
            ~/.cache/ms-playwright
          key: ui-playwright-${{ runner.os }}-${{ hashFiles('scripts/ui-compare/package.json') }}

      - name: Playwright install
        id: pwinstall
        working-directory: scripts/ui-compare
        run: |
          if [ "${{ steps.pw.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium >/dev/null
          else
            npm install --no-audit --no-fund >/dev/null
            npx playwright install --with-deps chromium >/dev/null
          fi
          google-chrome --version || true

      - name: Serve the prototype
        run: |
          nohup node scripts/ui-compare/proto-serve.mjs design/viewer-proto/dist 4173 > "$RUNNER_TEMP/proto-serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:4173/api/public/settings

      - name: Screenshots, recordings and checks
        working-directory: scripts/ui-compare
        run: node viewer-proto.mjs "$RUNNER_TEMP/proto"

      - name: Summary
        if: always()
        run: head -c 60000 "$RUNNER_TEMP/proto/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Logs on failure
        if: failure()
        run: |
          tail -50 "$RUNNER_TEMP/proto-serve.log" || true
          docker logs openlist 2>&1 | tail -50 | grep -viE "password|token" || true

      - name: Save Prototype build cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: design/viewer-proto/dist
          key: ${{ steps.keys.outputs.proto }}
      - name: Save Release build cache
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ${{ steps.keys.outputs.dist }}
      - name: Save pnpm store cache
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.c1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: ui-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Save Sample files
        if: ${{ !cancelled() && steps.samples.outputs.cache-hit != 'true' && steps.make.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ui-samples
          key: ui-samples-${{ hashFiles('scripts/ui-compare/make-samples.sh') }}
      - name: Save Playwright cache
        if: ${{ !cancelled() && steps.pw.outputs.cache-hit != 'true' && steps.pwinstall.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            scripts/ui-compare/node_modules
            ~/.cache/ms-playwright
          key: ui-playwright-${{ runner.os }}-${{ hashFiles('scripts/ui-compare/package.json') }}

      # Throwaway container, sample files and a random password that is not in
      # any of these files: nothing here needs encrypting.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewer-proto
          path: ${{ runner.temp }}/proto
          retention-days: 7
