# This workflow builds a rolling version of the OpenList frontend and publishes it on GitHub.
#
# This will:
#
# - Upload the release assets to GitHub, git tagged `rolling` for main and `canary`
#   for the canary branch (a node follows one of them: frontend_channel).
#
# This workflow can be triggered on pushes to the `main` and `canary` branches, or manually via the GitHub Actions UI.

name: Rolling Build

on:
  push:
    branches:
      - main
      - canary
  workflow_dispatch:
    inputs:
      draft:
        description: "Create draft release"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rolling:
    name: Rolling Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false

      - name: Build Pre-release
        run: |
          chmod +x build.sh
          ./build.sh --dev --compress --skip-i18n

      - name: Read version and determine tag name
        id: version
        run: |
          version=$(cat dist/VERSION)
          echo "version=$version" >> $GITHUB_OUTPUT
          # one release tag per channel: main -> rolling, canary -> canary; the
          # delete step below removes only this channel's release
          if [ "$GITHUB_REF_NAME" = "canary" ]; then
            echo "tag_name=canary" >> $GITHUB_OUTPUT
            echo "channel_note=Canary build for one node (frontend_channel=canary); not what the other nodes follow." >> $GITHUB_OUTPUT
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "tag_name=rolling" >> $GITHUB_OUTPUT
            echo "channel_note=This is a development build and not intended for production use." >> $GITHUB_OUTPUT
          else
            echo "refusing to publish from $GITHUB_REF_NAME: only main (rolling) and canary publish" >&2
            exit 1
          fi

      - name: Remove the existing pre-release
        run: gh release delete ${{ steps.version.outputs.tag_name }} --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release on GitHub
        run: |
          gh release create \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag_name == 'canary' && 'Canary' || 'Pre-release' }} ${{ steps.version.outputs.version }}" \
            --notes "Build for ${{ steps.version.outputs.version }}<br>${{ steps.version.outputs.channel_note }}" \
            --prerelease \
            --draft=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft || false }} \
            ${{ steps.version.outputs.tag_name }} \
            dist/openlist-frontend-dist-v*-*.tar.gz \
            dist/i18n.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
